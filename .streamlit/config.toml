[theme]
primaryColor = "#4f46e5"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#141414"
textColor = "#f5f5f5"
font = "sans serif"

[server]
headless = true
port = 8080
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 10
runOnSave = true

[browser]
gatherUsageStats = false

[logger]
level = "warning"

[client]
showSidebarNavigation = true
